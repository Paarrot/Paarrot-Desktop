<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Send Message Settings</title>
  <style>
    body {
      margin: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #d0d0d0;
      background-color: #2d2d2d;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 15px;
      background-color: #3d3d3d;
      border: 1px solid #555;
      border-radius: 4px;
      color: #d0d0d0;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      resize: vertical;
      min-height: 80px;
    }

    textarea:focus {
      outline: none;
      border-color: #0e99e0;
    }

    .info {
      padding: 8px;
      background-color: #3d3d3d;
      border-left: 3px solid #0e99e0;
      margin-bottom: 15px;
      font-size: 12px;
    }

    .examples {
      padding: 8px;
      background-color: #3d3d3d;
      border-left: 3px solid #666;
      margin-top: 10px;
      font-size: 11px;
    }

    .examples h4 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #aaa;
    }

    .examples ul {
      margin: 0;
      padding-left: 20px;
    }

    .examples li {
      margin-bottom: 4px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="info">
    Enter the message to send to the currently active room when this button is pressed.
  </div>

  <label for="message">Message:</label>
  <textarea id="message" placeholder="Type your message here..."></textarea>

  <div class="examples">
    <h4>Example Messages:</h4>
    <ul>
      <li>BRB! (Be Right Back)</li>
      <li>AFK for a few minutes</li>
      <li>On my way!</li>
      <li>Thanks everyone!</li>
    </ul>
  </div>

  <script>
    let websocket = null;
    let uuid = null;
    let actionInfo = null;
    let currentSettings = {};
    let saveTimeout = null;

    function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
      uuid = inUUID;
      actionInfo = JSON.parse(inActionInfo);
      currentSettings = actionInfo.payload.settings || {};

      websocket = new WebSocket('ws://127.0.0.1:' + inPort);

      websocket.onopen = function() {
        const json = {
          event: inRegisterEvent,
          uuid: inUUID
        };
        websocket.send(JSON.stringify(json));
      };

      // Set current value
      if (currentSettings.message) {
        document.getElementById('message').value = currentSettings.message;
      }
    }

    function saveSettings() {
      // Debounce saving
      if (saveTimeout) {
        clearTimeout(saveTimeout);
      }

      saveTimeout = setTimeout(() => {
        const settings = {
          message: document.getElementById('message').value
        };

        if (websocket && websocket.readyState === WebSocket.OPEN) {
          const message = {
            event: 'setSettings',
            context: uuid,
            payload: settings
          };
          websocket.send(JSON.stringify(message));
        }
      }, 300);
    }

    // Event listener
    document.getElementById('message').addEventListener('input', saveSettings);
  </script>
</body>
</html>
