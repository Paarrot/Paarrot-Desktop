name: Build

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-windows:
    runs-on: windows
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Install dependencies (root)
        run: npm install
      
      - name: Install dependencies (cinny)
        working-directory: ./cinny
        run: npm install
      
      - name: Build Tauri app
        run: npm run tauri build
      
      - name: Upload MSI installer
        uses: actions/upload-artifact@v3
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    
    steps:
      - name: Install base dependencies
        run: |
          apt-get update
          apt-get install -y git curl wget ca-certificates gnupg
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
      
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install system dependencies
        run: |
          apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup2.4-dev build-essential pkg-config
      
      - name: Install dependencies (root)
        run: npm install
      
      - name: Install dependencies (cinny)
        working-directory: ./cinny
        run: npm install
      
      - name: Build Tauri app
        run: |
          . "$HOME/.cargo/env"
          npm run tauri build
      
      - name: Upload AppImage
        uses: actions/upload-artifact@v3
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
