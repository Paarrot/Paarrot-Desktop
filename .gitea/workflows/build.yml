name: Build

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-windows:
    runs-on: windows
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Install dependencies (root)
        run: npm install
      
      - name: Install dependencies (cinny)
        working-directory: ./cinny
        run: npm install
      
      - name: Build Tauri app
        run: npm run tauri build
      
      - name: Upload MSI installer
        uses: actions/upload-artifact@v3
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup2.4-dev
      
      - name: Install dependencies (root)
        run: npm install
      
      - name: Install dependencies (cinny)
        working-directory: ./cinny
        run: npm install
      
      - name: Build Tauri app
        run: npm run tauri build
      
      - name: Upload AppImage
        uses: actions/upload-artifact@v3
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
