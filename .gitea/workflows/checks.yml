name: Checks

on:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Checkout submodules manually
        run: |
          set -euo pipefail
          # Use the same host/scheme the runner already used for origin (not public HTTPS).
          ORIGIN_URL=$(git remote get-url origin)
          ORIGIN_URL=${ORIGIN_URL%/}
          ORIGIN_URL=${ORIGIN_URL%.git}
          BASE_URL=${ORIGIN_URL%/*}
          CINNY_URL="${BASE_URL}/cinny.git"
          echo "Rewriting submodule URL to ${CINNY_URL}"
          git config submodule.cinny.url "${CINNY_URL}"
          git submodule sync --recursive

          if git submodule update --init --recursive; then
            echo "Submodules checked out at pinned commits."
            exit 0
          fi

          echo "Pinned submodule commit is unavailable on remote. Falling back to remote submodule HEAD."
          git submodule deinit -f --all || true
          rm -rf cinny .git/modules/cinny
          git config submodule.cinny.url "${CINNY_URL}"
          git submodule sync --recursive
          git submodule update --init --recursive --remote

          echo "Resolved submodule commit:"
          git -C cinny rev-parse HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cinny/package-lock.json

      - name: Install dependencies (cinny)
        working-directory: ./cinny
        run: npm ci --prefer-offline

      # ci-checks.sh always exits 0: findings become issues, not failed builds.
      - name: Run checks
        env:
          API_BASE: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          # Prefer a PAT with issue write scope (secret: GITEA_TOKEN).
          # Default GITHUB_TOKEN is usually scoped to this repo only.
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${GITEA_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "No GITEA_TOKEN/GITHUB_TOKEN available to file issues"
            exit 0
          fi
          export TOKEN
          bash cinny/scripts/ci-checks.sh
